<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<title>Rimborsi trasferte</title>
<style>
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface-2:#f0efe9;--line:#e3e1d9;--line-2:#d3d0c5;
  --text:#1d1d1b;--muted:#6d6b64;--faint:#9a978e;
  --accent:#2350d8;--accent-ink:#ffffff;--accent-soft:#e8eeff;
  --ok:#17784a;--ok-soft:#e3f3ea;--warn:#a85a07;--warn-soft:#fdf1df;--bad:#b42318;--bad-soft:#fde8e6;
  --ai:#e9efff;--ai-line:#8fa9f5;--guess:#fff3d6;--guess-line:#e8b54f;
  --gT:#2f6fd0;--gS:#7a4cc2;--gR:#c0571b;
  --radius:10px;--shadow:0 1px 2px rgba(20,20,10,.05),0 10px 30px rgba(20,20,10,.08);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--surface:#1c1c1a;--surface-2:#252522;--line:#33322e;--line-2:#45443e;
  --text:#ecebe5;--muted:#a3a198;--faint:#77756d;
  --accent:#7b9bff;--accent-ink:#0f1630;--accent-soft:#1f2744;
  --ok:#5fca93;--ok-soft:#173326;--warn:#f0a94b;--warn-soft:#3a2a12;--bad:#ff8a7a;--bad-soft:#3e1d19;
  --ai:#1d2848;--ai-line:#4864b8;--guess:#3a2f15;--guess-line:#8f6c25;
  --gT:#7aa7f0;--gS:#b393ea;--gR:#ee9a62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12px}
.hidden{display:none!important}
a{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.store-pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;display:inline-flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.local{background:var(--warn)}
.spacer{flex:1}
main{max-width:1320px;margin:0 auto;padding:18px 20px 60px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.kpi-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-name{font-weight:650}
.kpi-big{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-big small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.kpi-groups{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.kpi-groups b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kpi-row div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi-row div b{font-variant-numeric:tabular-nums;font-size:15px}
.kpi-foot{font-size:12px;color:var(--muted);margin-top:8px}
.res-pos{color:var(--warn)}.res-zero{color:var(--ok)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters select,.filters input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 9px}
.filters input[type=search]{min-width:220px;flex:1;max-width:340px}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.grid{width:100%;border-collapse:collapse;min-width:1060px}
.grid th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;white-space:nowrap}
.grid th.num{text-align:right}
.grid td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tfoot td{font-weight:650;background:var(--surface-2);border-bottom:0}
.grid td.zero{color:var(--faint)}
.t-title{font-weight:600}
.t-sub{font-size:12px;color:var(--muted);margin-top:1px}
.typeic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-bozza{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.st-inviata{background:var(--ok-soft);color:var(--ok)}
.warnbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--warn)}
.warnbadge.err{color:var(--bad)}
.kmsub{display:block;font-size:11px;color:var(--muted)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,10,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.sheet{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:92vh}
.sheet.wide{max-width:1040px}
.sheet-head{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0}
.sheet-head h2{margin:2px 0 0;font-size:19px;letter-spacing:-.01em}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.head-tot{margin-left:auto;text-align:right}
.head-tot .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sheet-body{padding:16px 20px;overflow:auto;flex:1}
.sheet-foot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 14px 14px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-head h3{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;grid-column:span 4;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
.fld.s2{grid-column:span 2}.fld.s3{grid-column:span 3}.fld.s6{grid-column:span 6}.fld.s8{grid-column:span 8}.fld.s12{grid-column:span 12}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:60px}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:var(--surface-2);color:var(--muted)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding-top:20px}
.check input{width:16px;height:16px}
.ai-doc{background:var(--ai)!important;border-color:var(--ai-line)!important}
.ai-guess{background:var(--guess)!important;border-color:var(--guess-line)!important}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid}
.banner{border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px}
.banner.ai{background:var(--ai);border:1px solid var(--ai-line)}
.banner.info{background:var(--surface-2);border:1px solid var(--line)}
.avvisi{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.avvisi li{border-radius:8px;padding:7px 11px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.avvisi li.warn{background:var(--warn-soft);color:var(--warn)}
.avvisi li.err{background:var(--bad-soft);color:var(--bad)}
.kmcalc{margin-top:10px;font-size:13px;color:var(--muted)}
.kmcalc b{color:var(--text)}

.srow{display:grid;grid-template-columns:86px 1fr auto 110px 72px;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.km{color:var(--muted)}
.s-main b{font-weight:600}
.s-sub{font-size:12px;color:var(--muted)}
.s-doc{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.s-act{display:flex;justify-content:flex-end}
.gtag{font-size:10.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px;border:1px solid currentColor;opacity:.9}
.g-T{color:var(--gT)}.g-S{color:var(--gS)}.g-R{color:var(--gR)}
.doclink{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;cursor:pointer;background:var(--surface);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doclink:hover{background:var(--surface-2)}
.sform{border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin:8px 0;background:var(--surface)}
.sform-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.choice button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer}
.choice button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.choice b{display:block;margin-bottom:3px}
.choice span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.mini th.num{text-align:right}
.mini td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.mini input,.mini select{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
.mini tr.sel td{background:var(--accent-soft)}
.folderlist{border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;background:var(--surface)}
.folderlist button{display:flex;width:100%;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer;text-align:left}
.folderlist button:hover{background:var(--surface-2)}
.crumbs{font-size:13px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0}

.welcome{max-width:760px;margin:6vh auto;padding:0 20px}
.welcome h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:300;box-shadow:var(--shadow);font-size:13px;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.busy{position:fixed;inset:0;z-index:250;background:rgba(15,15,10,.25);display:grid;place-items:center}
.busy div{background:var(--surface);border-radius:12px;padding:16px 22px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border:2.5px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .topbar-in{padding:10px 14px;gap:8px}
  .btn .lbl,.store-pill .lbl{display:none}
  main{padding:14px 14px 60px}
  .kpis{grid-template-columns:1fr}
  table.grid{min-width:0}
  .grid thead{display:none}
  .grid tbody tr{display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;padding:12px;border-bottom:1px solid var(--line)}
  .grid tbody td{border:0;padding:0}
  .grid td.c-cat,.grid td.c-soc-d{display:none}
  .grid td.c-ic{grid-row:span 3}
  .grid td.c-date{grid-column:2;font-size:12px;color:var(--muted)}
  .grid td.c-title{grid-column:2}
  .grid td.c-tot{grid-column:3;grid-row:1 / span 2;font-weight:700;font-size:15px}
  .grid td.c-meta{grid-column:2 / span 2;display:flex!important;gap:10px;align-items:center;flex-wrap:wrap}
  .grid tfoot{display:none}
  .fld,.fld.s3,.fld.s2,.fld.s6,.fld.s8{grid-column:span 12}
  .fld.half{grid-column:span 6}
  .srow{grid-template-columns:1fr auto;gap:2px 10px}
  .srow .s-date{grid-column:1;font-size:12px;color:var(--muted)}
  .srow .s-amt{grid-column:2;grid-row:1 / span 2}
  .srow .s-main{grid-column:1}
  .srow .s-doc{grid-column:1;justify-content:flex-start}
  .srow .s-act{grid-column:2}
  .choice,.wgrid{grid-template-columns:1fr}
  .overlay{padding:0}
  .sheet,.sheet.wide{max-height:100vh;height:100%;border-radius:0}
  .sheet-head,.sheet-foot{border-radius:0}
}
.c-meta{display:none}
</style>
</head>
<body>
<header class="topbar hidden" id="topbar">
  <div class="topbar-in">
    <span class="brand">Rimborsi</span>
    <span class="store-pill" id="storePill"></span>
    <span class="spacer"></span>
    <button class="btn ghost" data-act="reload" title="Ricarica dati"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
    <button class="btn" data-act="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">Impostazioni</span></button>
    <button class="btn" data-act="export"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Esporta</span></button>
    <button class="btn primary" data-act="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Nuova pratica</span></button>
  </div>
</header>
<main id="app"></main>

<script>
'use strict';
/* =========================================================
   Rimborsi trasferte — app personale single-file
   Archivio: OneDrive personale (Microsoft Graph) oppure locale (IndexedDB)
   ========================================================= */
const APP_VERSION = '0.1.0';
const DEFAULT_MODEL = 'claude-sonnet-5-5';
const PDFLIB_URL = 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const AUTH = 'https://login.microsoftonline.com/consumers/oauth2/v2.0';
const SCOPES = 'https://graph.microsoft.com/Files.ReadWrite offline_access openid profile';
const POINTER_FILE = 'rimborsi-trasferte.json';

/* ---------------- utility ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const fmtE = n => (+n || 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtK = n => (+n || 0).toLocaleString('it-IT', {maximumFractionDigits: 1});
const fmtD = d => d ? d.slice(0, 10).split('-').reverse().join('/') : '';
const fmtT = t => t == null ? '—' : (+t).toLocaleString('it-IT', {minimumFractionDigits: 4, maximumFractionDigits: 4});
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const yearOf = d => +(d || today()).slice(0, 4);
const daysBetween = (a, b) => Math.max(1, Math.round((new Date(b || a) - new Date(a)) / 864e5) + 1);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const ss = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} }

/* =========================================================
   ARCHIVIO — interfaccia comune
   readJSON(path) -> {data, etag}|null ; writeJSON(path, data, etag?) -> etag

class LocalFS {
  constructor() { this.kind = 'local'; }
  db() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open('rimborsi-fs', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  }
  async req(mode, fn) {
    const db = await this.db();
    return new Promise((res, rej) => { const r = fn(db.transaction('f', mode).objectStore('f')); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  _get(k) { return this.req('readonly', s => s.get(k)); }
  _put(k, v) { return this.req('readwrite', s => s.put(v, k)); }
  _del(k) { return this.req('readwrite', s => s.delete(k)); }
  _keys() { return this.req('readonly', s => s.getAllKeys()); }
  async readJSON(p) { const r = await this._get(p); if (!r) return null; return {data: JSON.parse(await r.blob.text()), etag: r.etag}; }
  async writeJSON(p, data, etag) {
    if (etag) { const cur = await this._get(p); if (cur && cur.etag !== etag) throw conflictErr(); }
    const ne = uid(); await this._put(p, {blob: new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}), etag: ne}); return ne;
  }
  async etagOf(p) { const r = await this._get(p); return r ? r.etag : null; }
  async putBlob(p, blob) { await this._put(p, {blob, etag: uid()}); }
  async getBlob(p) { const r = await this._get(p); if (!r) throw new Error('File non trovato: ' + p); return r.blob; }
  async remove(p) { for (const k of await this._keys()) if (k === p || k.startsWith(p + '/')) await this._del(k); }
  async rename(p, newName) {
    const np = p.split('/').slice(0, -1).concat(newName).join('/');
    for (const k of await this._keys()) if (k === p || k.startsWith(p + '/')) { const v = await this._get(k); await this._put(np + k.slice(p.length), v); await this._del(k); }
    return np;
  }
  async list(dir) {
    const pre = dir ? dir + '/' : ''; const out = new Map();
    for (const k of await this._keys()) if (k.startsWith(pre)) { const rest = k.slice(pre.length); const seg = rest.split('/')[0]; out.set(seg, {name: seg, isFolder: rest.includes('/')}); }
    return [...out.values()];
  }
  async wipe() { for (const k of await this._keys()) await this._del(k); }
}

const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function msLogin() {
  if (!dev.clientId) throw new Error('Inserisci prima il Client ID dell\'app Microsoft.');
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))));
  const st = uid() + uid(); ss.set('pkce', {v, st});

    scope: SCOPES, code_challenge: ch, code_challenge_method: 'S256', state: st, response_mode: 'query', prompt: 'select_account'});
}

  if (!r.ok) throw Object.assign(new Error(j.error_description?.split('\r\n')[0] || j.error || ('HTTP ' + r.status)), {auth: true});

  if (j.id_token) { try { const p = JSON.parse(atob(j.id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); dev.account = p.preferred_username || p.email || p.name || ''; saveDev(); } catch {} }
  tok.set(t); return t;
}
async function handleRedirect(qs) {
  const pk = ss.get('pkce'); ss.del('pkce');

  if (qs.get('error')) throw new Error('Accesso Microsoft non riuscito: ' + (qs.get('error_description') || qs.get('error')));
  if (!pk || pk.st !== qs.get('state')) throw new Error('Risposta di accesso non valida: riprova ad accedere.');
  await tokenRequest({grant_type: 'authorization_code', code: qs.get('code'), redirect_uri: redirectUri(), code_verifier: pk.v});

let refreshing = null;
async function accessToken() {

  if (!t.refresh) throw Object.assign(new Error('Sessione Microsoft scaduta.'), {auth: true});
  refreshing ||= tokenRequest({grant_type: 'refresh_token', refresh_token: t.refresh}).finally(() => { refreshing = null; });
  return (await refreshing).access;

class GraphFS {

  url(p, suffix = '') { return `${GRAPH}/me/drive/root:/${encPath(this.root + '/' + p)}:${suffix}`; }

  async readJSON(p) {

  }
  async etagOf(p) { const m = await this.meta(p); return m ? m.eTag : null; }
  async mkdirp(dir) {

      const base = parent ? `${GRAPH}/me/drive/root:/${encPath(parent)}:/children` : `${GRAPH}/me/drive/root/children`;
      const r = await gfetch(base, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: seg, folder: {}, '@microsoft.graph.conflictBehavior': 'fail'})});
      if (!r.ok && r.status !== 409) throw await gerr(r);

    try { S[key + 'Etag'] = await fs.writeJSON(path, S[key], S[key + 'Etag']); return; }
    catch (e) {
      if (!e.conflict) throw e;

function tariffaFor(veicoloId, anno) {
  const v = vehById(veicoloId); const t = v?.tariffe?.find(x => +x.anno === +anno);
  return t && t.euroKm !== '' && t.euroKm != null ? +t.euroKm : null;
}
function kmInfo(p) {
  if (p.tipo !== 'trasferta' || !p.veicoloId || !(+p.km)) return {km: +p.km || 0, tariffa: null, importo: 0, missing: false};
  const t = p.tariffaCongelata != null ? p.tariffaCongelata : tariffaFor(p.veicoloId, yearOf(p.data));
  if (t == null) return {km: +p.km, tariffa: null, importo: 0, missing: true};
  return {km: +p.km, tariffa: t, importo: r2(+p.km * t), missing: false};
}
function totals(p) {

  const k = kmInfo(p); cols.km = k.importo; grp.T += k.importo;
  let vittoAll = 0;
  for (const s of p.spese || []) {
    const c = catOf(s.categoria), v = r2(s.importo), g = gruppoOf(s);
    cols[c.col] = r2(cols[c.col] + v); grp[g] = r2(grp[g] + v);
    if (g === 'T' && c.tetto) vittoAll = r2(vittoAll + v);
  }
  const tot = r2(Object.values(cols).reduce((a, b) => a + b, 0));
  let oltreTetto = 0;
  if (p.tipo === 'trasferta' && vittoAll > 0) {
    const tetto = (p.estero ? S.cfg.parametri.tettoEstero : S.cfg.parametri.tettoItalia) * daysBetween(p.data, p.dataFine);
    oltreTetto = Math.max(0, r2(vittoAll - tetto));
  }
  return {cols, grp, tot, km: k, vittoAll, oltreTetto};
}
function checks(p, all = pratiche()) {
  const out = [], soc = socById(p.societaId), t = totals(p);
  const err = m => out.push({lvl: 'err', m}), warn = m => out.push({lvl: 'warn', m});
  if (!p.data) err('Manca la data.');
  if (!soc) err('Seleziona la società.');
  if (!(p.motivo || '').trim()) err('Manca il motivo.');
  if (p.tipo === 'trasferta' && !(p.controparte || '').trim()) err('Manca la controparte (chi hai incontrato / dove).');
  if (soc?.attivaDal && p.data && p.data < soc.attivaDal) err(`${soc.nome} rimborsa solo dal ${fmtD(soc.attivaDal)}.`);
  if (soc && !soc.attivaDal && soc.id === 'delos') warn(`${soc.nome}: data di inizio attività non impostata (Impostazioni → Società).`);
  for (const s of p.spese || []) {
    const c = catOf(s.categoria), g = gruppoOf(s), lab = `${c.label} ${fmtE(s.importo)} €`;
    if (g === 'R' && (!(s.ospiti || '').trim() || !(s.motivoRappr || '').trim())) err(`${lab}: per la rappresentanza indica ospiti e motivo.`);
    if (g === 'S' && s.fatturaIntestataA !== 'societa') warn(`${lab}: per un costo della società la fattura dovrebbe essere intestata a ${soc?.nome || 'la società'}.`);
    if (c.tracc && g === 'T' && s.pagamento && !TRACCIABILI.has(s.pagamento)) warn(`${lab}: pagamento non tracciabile, il rimborso può diventare tassabile.`);
    if (!(s.ricevute || []).length) warn(`${lab}: nessuna ricevuta allegata.`);
    if (!(+s.importo > 0)) err(`${c.label}: importo mancante.`);
  }
  if (p.tipo === 'trasferta') {
    if (p.kmStimati) warn('Km stimati dall\'AI: verificali.');
    if (t.km.missing) err(`Manca la tariffa ACI ${yearOf(p.data)} per il veicolo (Impostazioni → Veicoli).`);
    if (+p.km > 0 && !p.veicoloId) warn('Km indicati ma nessun veicolo selezionato: il rimborso km non viene calcolato.');
    if (soc?.comuneSede && (p.luogo || '').toLowerCase().includes(soc.comuneSede.toLowerCase()) && t.vittoAll > 0)
      warn(`Destinazione nel comune della sede (${soc.comuneSede}): vitto e alloggio lì non sono esenti.`);
    if (t.oltreTetto > 0) warn(`Vitto e alloggio superano di ${fmtE(t.oltreTetto)} € il tetto deducibile per la società.`);
    if (p.veicoloId && +p.km > 0) {
      const dup = all.find(o => o.id !== p.id && o.tipo === 'trasferta' && o.veicoloId === p.veicoloId && o.data === p.data && +o.km > 0 && o.societaId !== p.societaId);
      if (dup) warn(`Stesso giorno e stesso veicolo anche in ${dup.id} (${socById(dup.societaId)?.nome || ''}): controlla il doppio conteggio dei km.`);
    }
  }
  return out;
}

/* ---------------- avvio ---------------- */
async function boot() {
  try {
    const qs = new URLSearchParams(location.search);
    if (qs.get('code') || qs.get('error')) { busy('Accesso a Microsoft…'); await handleRedirect(qs); busy(null); }
    if (!dev.mode) return showWelcome();
    if (dev.mode === 'local') { fs = new LocalFS(); await loadAll(); return renderApp(); }
    if (!tok.get()) return showWelcome('Accedi di nuovo a OneDrive per continuare.');
    busy('Collegamento a OneDrive…');
    if (!dev.root) {
      const ptr = await readPointer().catch(() => null);
      if (ptr?.root) { dev.root = ptr.root; saveDev(); }
      else { busy(null); return pickFolder(true); }
    }
    fs = new GraphFS(dev.root); await loadAll(); busy(null); renderApp();
  } catch (e) {
    busy(null); console.error(e);
    if (e.auth) { tok.clear(); return showWelcome('La sessione Microsoft è scaduta o non valida: accedi di nuovo. (' + errMsg(e) + ')'); }
    $('#app').innerHTML = `<div class="welcome"><h1>Qualcosa non va</h1><p class="banner info">${esc(errMsg(e))}</p>
      <p><button class="btn primary" onclick="location.reload()">Riprova</button> <button class="btn" id="resetDev">Torna alla schermata iniziale</button></p></div>`;
    $('#resetDev').onclick = () => { dev.mode = null; saveDev(); location.reload(); };
  }
}

function socStats() {
  const st = {};
  for (const s of S.cfg.societa) st[s.id] = {mat: 0, grp: {T: 0, S: 0, R: 0}, inviato: 0, bozze: 0, nBozze: 0, incassato: 0};
  for (const p of pratiche()) {
    const x = st[p.societaId]; if (!x) continue; const t = totals(p);
    x.mat = r2(x.mat + t.tot); for (const g in t.grp) x.grp[g] = r2(x.grp[g] + t.grp[g]);
    if (p.stato === 'inviata') x.inviato = r2(x.inviato + t.tot); else { x.bozze = r2(x.bozze + t.tot); x.nBozze++; }
  }
  for (const pg of S.pag.pagamenti) if (st[pg.societaId]) st[pg.societaId].incassato = r2(st[pg.societaId].incassato + (+pg.importo || 0));
  return st;
}
function renderKPIs() {

async function prepFile(file) {
  const type = file.type || '';
  if (type.startsWith('image/')) {
    try {
      const bmp = await createImageBitmap(file);
      const max = 1800, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      if (blob) return {blob, ext: '.jpg', orig: file.name};
    } catch {}
  }
  const ext = (file.name.match(/\.[a-z0-9]{2,5}$/i)?.[0] || (type === 'application/pdf' ? '.pdf' : '')).toLowerCase();
  return {blob: file, ext, orig: file.name};
}
function usedNames(d) { const s = new Set(d.allegati || []); for (const x of d.spese || []) for (const n of x.ricevute || []) s.add(n); return s; }
function uniqueName(d, base, ext, extra = new Set()) {
  const used = usedNames(d); let n = safeName(base) + ext, i = 2;
  while (used.has(n) || extra.has(n)) n = `${safeName(base)} (${i++})${ext}`;
  return n;
}
function spesaFileBase(s) { return `${s.data || 'senza data'} ${catOf(s.categoria).short} ${fmtE(s.importo)}`; }
async function openFile(ed, name) {
  const w = window.open('', '_blank');
  try {
    const blob = ed.pending.get(name) || await fs.getBlob(`pratiche/${ed.d.folder}/${name}`);
    const url = URL.createObjectURL(blob);
    if (w) w.location = url; else download(blob, name);
  } catch (e) { w && w.close(); toast(errMsg(e), true); }
}
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
const isPdf = (blob, name = '') => blob.type === 'application/pdf' || /\.pdf$/i.test(name);
const isImg = (blob, name = '') => /^image\/(jpeg|png|gif|webp)$/.test(blob.type) || /\.(jpe?g|png|gif|webp)$/i.test(name);

/* =========================================================
   AI (Anthropic Messages API direttamente dal browser)
   ========================================================= */
async function fileBlock(blob, name) {
  const data = await blobToB64(blob);
  if (isPdf(blob, name)) return {type: 'document', source: {type: 'base64', media_type: 'application/pdf', data}};
  if (isImg(blob, name)) { const mt = blob.type && blob.type.startsWith('image/') ? blob.type : (/\.png$/i.test(name) ? 'image/png' : 'image/jpeg'); return {type: 'image', source: {type: 'base64', media_type: mt, data}}; }
  return null;
}
async function claude(content, system, maxTokens = 4096) {
  if (!dev.apiKey) throw new Error('Chiave Anthropic non impostata (Impostazioni → Generale).');
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers: {'content-type': 'application/json', 'x-api-key': dev.apiKey,
      'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: dev.model || DEFAULT_MODEL, max_tokens: maxTokens, system, messages: [{role: 'user', content}]})});
  } catch { throw new Error('AI non raggiungibile: controlla la connessione.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('AI: ' + (j.error?.message || ('HTTP ' + r.status)));
  const txt = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/); const s = m ? m[1] : txt;
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('Risposta AI non interpretabile.');
  return JSON.parse(s.slice(a, b + 1));
}

async function aiCompilePratica(files, text) {

Km: per i tratti presenti in tratteFrequenti usa quei km (sono di sola andata); altrimenti stima la distanza stradale e indica "stima" in fonti.km.

function fonteCls(f) { return f === 'stima' ? 'stima' : 'doc'; }
function draftFromAI(res, files) {
  const tipo = res.tipo === 'spesa' ? 'spesa' : 'trasferta';
  const d = newPratica(tipo); d._ai = {}; d._aiNota = res.nota || '';
  const set = (k, v) => { if (v === null || v === undefined || v === '') return; d[k] = v; d._ai[k] = fonteCls(res.fonti?.[k]); };
  if (/^\d{4}-\d{2}-\d{2}$/.test(res.data || '')) set('data', res.data);
  if (/^\d{4}-\d{2}-\d{2}$/.test(res.dataFine || '') && res.dataFine !== res.data) set('dataFine', res.dataFine);
  if (socById(res.societaId)) set('societaId', res.societaId);
  ['luogo', 'percorso', 'motivo', 'controparte', 'deal'].forEach(k => set(k, typeof res[k] === 'string' ? res[k].trim() : null));
  if (tipo === 'trasferta') {
    if (vehById(res.veicoloId)) set('veicoloId', res.veicoloId); else if (res.veicoloId === null) d.veicoloId = '';
    if (+res.km > 0) { set('km', Math.round(+res.km)); if (res.fonti?.km === 'stima') d.kmStimati = true; }
    d.ar = res.ar !== false; d.estero = !!res.estero;
  }
  const pending = new Map(), usedIdx = new Set(), nameOfIdx = {};
  d.spese = (res.spese || []).filter(s => +s.importo > 0).map(x => {
    const s = newSpesa(d); s._ai = {};
    const sset = (k, v) => { if (v === null || v === undefined || v === '') return; s[k] = v; s._ai[k] = fonteCls(x.fonti?.[k]); };
    if (/^\d{4}-\d{2}-\d{2}$/.test(x.data || '')) sset('data', x.data);
    sset('categoria', CAT[x.categoria] ? x.categoria : (tipo === 'trasferta' ? 'altro_trasf' : 'altro_soc'));
    sset('importo', r2(x.importo));
    if (PAGAMENTI[x.pagamento]) sset('pagamento', x.pagamento);
    sset('descrizione', x.descrizione);
    if (INTESTAZIONI[x.fatturaIntestataA]) sset('fatturaIntestataA', x.fatturaIntestataA);
    if (+x.imponibile) sset('imponibile', r2(x.imponibile)); if (+x.iva) sset('iva', r2(x.iva));
    sset('ospiti', x.ospiti); sset('motivoRappr', x.motivoRappr);
    const idxs = [].concat(x.documenti ?? x.fileIndex ?? []).map(Number).filter(i => files[i]);
    for (const i of idxs) {
      if (!nameOfIdx[i]) { nameOfIdx[i] = uniqueName(d, spesaFileBase(s), files[i].ext, new Set(pending.keys())); pending.set(nameOfIdx[i], files[i].blob); }
      if (!s.ricevute.includes(nameOfIdx[i])) s.ricevute.push(nameOfIdx[i]); usedIdx.add(i);
    }
    return s;
  });
  files.forEach((f, i) => { if (!usedIdx.has(i)) { const n = uniqueName(d, f.orig.replace(/\.[^.]+$/, ''), f.ext, new Set(pending.keys())); pending.set(n, f.blob); d.allegati.push(n); } });
  return {d, pending};
}

async function creaInvio(socId, ids, silent = false) {
  busy('Preparo l\'invio…');
  const nums = Object.keys(S.idx.invii).map(k => +k.slice(1) || 0);
  const id = 'I' + String(Math.max(0, ...nums) + 1).padStart(3, '0');
  const fresh = [];
  for (const pid of ids) {
    const p = S.idx.pratiche[pid];
    const r = await fs.readJSON(`pratiche/${p.folder}/pratica.json`);
    const d = r ? Object.assign(r.data, {folder: p.folder}) : clone(p);
    if (d.stato === 'inviata') throw new Error(`${pid} risulta già inviata (${d.invioId}). Ricarica i dati.`);
    const k = kmInfo(d);
    Object.assign(d, {stato: 'inviata', invioId: id, tariffaCongelata: d.tipo === 'trasferta' && d.veicoloId && +d.km ? k.tariffa : null, updatedAt: new Date().toISOString()});
    fresh.push({d, etag: r?.etag});
  }

  const months = [...new Set(prat.map(p => p.data.slice(0, 7)))].sort();
  const per = months.length > 1 ? months[0] + '_' + months[months.length - 1] : months[0];
  const grp = {T: 0, S: 0, R: 0}; let tot = 0;
  for (const p of prat) { const t = totals(p); tot = r2(tot + t.tot); for (const g in grp) grp[g] = r2(grp[g] + t.grp[g]); }
  const inv = {id, data: today(), societaId: socId, pratiche: ids, totale: tot, gruppi: grp, pdf: safeName(`${id} - ${per} - ${soc?.nome || ''}`) + '.pdf', createdAt: new Date().toISOString()};
  busy('Genero il PDF…');
  const bytes = await buildPdf(inv, prat);
  const blob = new Blob([bytes], {type: 'application/pdf'});
  busy('Salvo l\'invio…');
  await fs.putBlob('invii/' + inv.pdf, blob);
  await fs.writeJSON(`invii/${id}.json`, inv);
  for (const {d, etag} of fresh) {
    const base = `pratiche/${d.folder}/`;
    await fs.writeJSON(base + 'pratica.json', d, etag).catch(e => { if (e.conflict) throw new Error(`${d.id} è stata modificata altrove durante l'invio: ricarica e ripeti.`); throw e; });
    await fs.putBlob(base + 'riepilogo.txt', new Blob([riepilogoTxt(d)], {type: 'text/plain;charset=utf-8'})).catch(() => {});
  }
  await updateIndex(idx => { for (const {d} of fresh) idx.pratiche[d.id] = d; idx.invii[id] = inv; });
  busy(null); refreshMain(); if (!silent) { download(blob, inv.pdf); toast(`Invio ${id} creato: ${ids.length} pratiche, ${fmtE(tot)} €`); }
}
async function annullaInvio(id) {
  busy('Annullo l\'invio…');
  const inv = clone(S.idx.invii[id]);
  for (const pid of inv.pratiche) {
    const p = S.idx.pratiche[pid]; if (!p) continue;
    const r = await fs.readJSON(`pratiche/${p.folder}/pratica.json`);
    const d = r ? Object.assign(r.data, {folder: p.folder}) : clone(p);
    if (d.invioId !== id) continue;
    Object.assign(d, {stato: 'bozza', invioId: null, tariffaCongelata: null, updatedAt: new Date().toISOString()});
    await fs.writeJSON(`pratiche/${d.folder}/pratica.json`, d, r?.etag);
    await updateIndex(idx => { idx.pratiche[d.id] = d; });
  }
  Object.assign(inv, {annullato: true, annullatoIl: today()});
  await fs.writeJSON(`invii/${id}.json`, inv);

}

      const g = gruppoOf(s), refs = (s.ricevute || []).map(n => { if (!docNum.has(n)) { docNum.set(n, docNum.size + 1); receipts.push({p, name: n, n: docNum.size}); } return '#' + docNum.get(n); }).join(' ');
      const desc = [s.descrizione, g !== 'T' ? INTESTAZIONI[s.fatturaIntestataA] : '', s.imponibile ? `imp. ${fmtE(s.imponibile)} + IVA ${fmtE(s.iva || 0)}` : '', g === 'R' ? `Ospiti: ${s.ospiti}. Motivo: ${s.motivoRappr}` : ''].filter(Boolean).join('\n');
      rows.push([fmtD(s.data), catOf(s.categoria).label, GROUPS[g], desc, PAGAMENTI[s.pagamento] || '', refs || 'manca', fmtE(s.importo)]);
    }
    for (const n of p.allegati || []) if (!docNum.has(n)) { docNum.set(n, docNum.size + 1); receipts.push({p, name: n, n: docNum.size, allegato: true}); }
    rows.push(['', '', '', 'TOTALE PRATICA', '', '', fmtE(t.tot)]);
    h2('Dettaglio spese');
    table([{h: 'Data', w: 50}, {h: 'Categoria', w: 82}, {h: 'Natura', w: 74}, {h: 'Descrizione', w: 145}, {h: 'Pagamento', w: 52}, {h: 'Doc.', w: 44}, {h: 'EUR', w: 64, a: 'r'}], rows, {bold: new Set([rows.length - 1])});
    if (t.oltreTetto > 0) para(`Vitto e alloggio oltre il tetto deducibile per la società: ${fmtE(t.oltreTetto)} EUR.`, {size: 8, c: mute});
    if (docNum.size) para('Documenti allegati nelle pagine seguenti: ' + [...docNum].map(([n, k]) => `#${k} ${n}`).join('; '), {size: 8, c: mute});

    for (const r of receipts.splice(0)) {
      const label = `${p.id} - documento #${r.n}${r.allegato ? ' (allegato)' : ''} - ${r.name}`;
      let blob = null;
      try { blob = opts.blobs?.get(r.name) || await fs.getBlob(`pratiche/${p.folder}/${r.name}`); } catch {}
      const bytes = blob ? new Uint8Array(await blob.arrayBuffer()) : null;
      const notePage = msg => { newPage(); T(label, M, y - 9, {size: 8.5, b: true, c: mute}); y -= 30; para(msg, {size: 10}); };
      if (!bytes) { notePage('Documento non disponibile nell\'archivio.'); continue; }
      if (isPdf(blob, r.name)) {
        try {
          const src = await PDFDocument.load(bytes, {ignoreEncryption: true});
          const pages = await doc.copyPages(src, src.getPageIndices());
          pages.forEach((pg, k) => {
            doc.addPage(pg); const {width, height} = pg.getSize();
            const lab = san(label + (pages.length > 1 ? ` (pag. ${k + 1}/${pages.length})` : ''));
            const lw = Math.min(width - 20, F.widthOfTextAtSize(lab, 7.5) + 10);
            pg.drawRectangle({x: 8, y: height - 19, width: lw, height: 13, color: rgb(1, 1, 1), opacity: .85});
            pg.drawText(lab, {x: 13, y: height - 15.5, size: 7.5, font: F, color: mute});
          });
        } catch { notePage('PDF non incorporabile (protetto o danneggiato): vedi il file originale nella cartella della pratica.'); }
      } else if (isImg(blob, r.name)) {
        try {
          const img = /\.png$/i.test(r.name) || blob.type === 'image/png' ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
          newPage(); T(label, M, y - 9, {size: 8.5, b: true, c: mute}); y -= 22;
          const sc = Math.min(CW / img.width, (y - M - 10) / img.height, 2);
          const w = img.width * sc, h = img.height * sc;
          page.drawImage(img, {x: M + (CW - w) / 2, y: y - h, width: w, height: h});
        } catch { notePage('Immagine in formato non supportato nel PDF: vedi il file originale nella cartella della pratica.'); }
      } else notePage('Documento in formato non incorporabile: vedi il file originale nella cartella della pratica.');
    }
  }
  const pages = doc.getPages(), n = pages.length;
  pages.forEach((pg, i) => {
    const {width} = pg.getSize(); const f = san(`${soc?.nome || ''} - ${opts.preview ? 'Anteprima' : 'Invio ' + inv.id} - pag. ${i + 1}/${n}`);
    pg.drawText(f, {x: width - 28 - F.widthOfTextAtSize(f, 7.5), y: 16, size: 7.5, font: F, color: mute});
  });
  return doc.save();
}

      draw();
    } else if (dl) { const ks = dl.dataset.del.split('.'), i = +ks.pop(), [o, k] = path(cfg, ks.join('.')); o[k].splice(i, 1); draw(); }
  });
  draw();
}

  for (const x of P) {
    n++; const id = 'P' + String(n).padStart(4, '0');
    const d = Object.assign(newPratica(x.tipo), {id, data: x.data, dataFine: x.dataFine || '', societaId: x.soc, luogo: x.luogo, percorso: x.percorso || '', km: x.km || 0, kmStimati: !!x.kmStimati,
      veicoloId: x.tipo === 'trasferta' ? 'cayenne' : '', motivo: x.motivo, controparte: x.controparte || '', deal: x.deal || '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()});
    d.spese = x.spese.filter(s => s[1] > 0).map(([cat, imp, pag, desc, extra]) => Object.assign(newSpesa(d), {categoria: cat, importo: imp, pagamento: pag, descrizione: desc}, extra || {}));
    d.folder = folderName(d);
    for (const s of d.spese) {
      if (s.categoria === 'vitto' && s.pagamento === 'contanti') continue;
      const name = uniqueName(d, spesaFileBase(s), '.jpg');
      await fs.putBlob(`pratiche/${d.folder}/${name}`, await demoReceipt(['RICEVUTA DEMO', s.descrizione.slice(0, 30), fmtD(s.data), 'Totale EUR ' + fmtE(s.importo), PAGAMENTI[s.pagamento]]));
      s.ricevute = [name];
    }
    await fs.writeJSON(`pratiche/${d.folder}/pratica.json`, d);
    idx.pratiche[id] = d;
  }
  S.idx = idx; S.idxEtag = await fs.writeJSON('indice.json', idx);
  // un invio già fatto per i primi due mesi di Delos, con incasso parziale
  await creaInvio('delos', ['P0001', 'P0002'], true).catch(e => console.warn('Invio demo non creato:', e));
  await updatePag(pg => { pg.pagamenti = [{id: uid(), societaId: 'delos', data: base(0) + '-02', importo: 900, riferimento: 'Bonifico demo'}]; });
}

boot();
</script>
